server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects (e.g. /docs -> /docs/) must not carry the container host:port.
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain image/svg+xml application/json application/javascript;

    # nginx drops server-level add_header in any location that sets its own,
    # so the security headers live in an include repeated per location.

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
